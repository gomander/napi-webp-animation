[package]
authors = ["Gunnar Omander <gunnar@gomander.dev>"]
edition = "2021"
name = "napi_webp_animation"
version = "0.0.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "^3.12.0"
napi-derive = "^3.6.2"
thiserror = "^2.0.19"
webp-animation = "^0.10.0"

[build-dependencies]
napi-build = "^2.4.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
